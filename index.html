<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de APK</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f1f1f1;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--card:#262626;--ac:#60a5fa}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0 auto;padding:16px;max-width:480px}
h1{font-size:22px}
label{display:block;background:var(--card);border-radius:10px;padding:12px;margin:10px 0;font-size:14px}
input{display:block;width:100%;margin-top:6px;color:var(--fg)}
button,a#dl{display:block;box-sizing:border-box;width:100%;text-align:center;text-decoration:none;font-size:16px;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;margin:10px 0}
a#dl[hidden]{display:none}
pre{background:var(--card);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;min-height:40px}
small{opacity:.7}
</style>
</head>
<body>
<h1>Gerador de APK</h1>
<small>Funciona offline. Troque os arquivos da casca pelo seu site e baixe o APK assinado.</small>
<label>1. APK casca (app-debug.apk)<input type="file" id="shell" accept=".apk"></label>
<label>2. Seu HTML ou ZIP<input type="file" id="src" accept=".html,.htm,.zip"></label>
<button id="go">Gerar APK</button>
<a id="dl" hidden>Baixar APK</a>
<pre id="log"></pre>
<script>
const $=id=>document.getElementById(id),enc=s=>new TextEncoder().encode(s);
const log=m=>{$('log').textContent+=m+'\n'};
const u8=(...n)=>new Uint8Array(n);
const cat=(...a)=>{let n=0;for(const x of a)n+=x.length;const o=new Uint8Array(n);let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};
const P=(n,b)=>{const a=new Uint8Array(b);for(let i=0;i<b;i++)a[i]=(n>>>(8*i))&255;return a};
const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sha=async d=>new Uint8Array(await crypto.subtle.digest('SHA-256',d));
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=d=>{let c=-1;for(let i=0;i<d.length;i++)c=CT[(c^d[i])&255]^(c>>>8);return(c^-1)>>>0};
const DATE=((2024-1980)<<9)|(1<<5)|1;

/* ---------- ZIP ---------- */
async function inflate(u){const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function data(e){if(e.method===0)return e.raw;if(e.method===8)return inflate(e.raw);throw Error('Compressão não suportada: '+e.name)}
async function readZip(buf){
  const d=new Uint8Array(buf),v=new DataView(buf);let e=d.length-22;
  while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw Error('Não é um ZIP/APK válido.');
  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const out=[];
  for(let i=0;i<n;i++){
    const method=v.getUint16(p+10,true),crc=v.getUint32(p+16,true),cs=v.getUint32(p+20,true),us=v.getUint32(p+24,true);
    const nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
    const name=new TextDecoder().decode(d.subarray(p+46,p+46+nl));
    const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);
    out.push({name,method,crc,us,raw:d.subarray(ds,ds+cs)});
    p+=46+nl+xl+cl;
  }
  return out;
}
function writeZip(fs){
  const out=[],cd=[];let off=0;
  for(const e of fs){
    const nb=enc(e.name),c=e.raw.length;
    const hd=cat(P(0x04034b50,4),P(20,2),P(0x800,2),P(e.method,2),P(0,2),P(DATE,2),P(e.crc,4),P(c,4),P(e.us,4),P(nb.length,2),P(0,2),nb);
    cd.push(cat(P(0x02014b50,4),P(20,2),P(20,2),P(0x800,2),P(e.method,2),P(0,2),P(DATE,2),P(e.crc,4),P(c,4),P(e.us,4),P(nb.length,2),P(0,2),P(0,2),P(0,2),P(0,2),P(0,4),P(off,4),nb));
    out.push(hd,e.raw);off+=hd.length+c;
  }
  const cs=cd.reduce((s,x)=>s+x.length,0);
  return new Blob([...out,...cd,cat(P(0x06054b50,4),P(0,2),P(0,2),P(fs.length,2),P(fs.length,2),P(cs,4),P(off,4),P(0,2))],{type:'application/vnd.android.package-archive'});
}

/* ---------- ASN.1 ---------- */
const T=(t,...c)=>{const b=cat(...c),n=b.length;return cat(u8(t,...(n<128?[n]:n<256?[0x81,n]:[0x82,n>>8,n&255])),b)};
const seq=(...c)=>T(0x30,...c),ctx=(n,...c)=>T(0xa0+n,...c),NUL=u8(5,0);
const oid=s=>{const p=s.split('.').map(Number),o=[40*p[0]+p[1]];for(const n of p.slice(2)){const t=[n&127];let m=n>>7;while(m){t.unshift((m&127)|128);m>>=7}o.push(...t)}return T(6,u8(...o))};
const NAME=seq(T(0x31,seq(oid('2.5.4.3'),T(0x0c,enc('Gerador APK')))));
const ALG={name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'};

async function getId(){
  try{const s=JSON.parse(localStorage.getItem('apkid'));if(s)return{key:await crypto.subtle.importKey('jwk',s.jwk,ALG,false,['sign']),cert:unb64(s.cert),serial:unb64(s.serial)}}catch(e){}
  log('Gerando chave de assinatura (alguns segundos)...');
  const kp=await crypto.subtle.generateKey({...ALG,modulusLength:2048,publicExponent:u8(1,0,1)},true,['sign','verify']);
  const spki=new Uint8Array(await crypto.subtle.exportKey('spki',kp.publicKey));
  const serial=crypto.getRandomValues(new Uint8Array(8));serial[0]=(serial[0]&0x7f)|1;
  const sa=seq(oid('1.2.840.113549.1.1.11'),NUL);
  const tbs=seq(ctx(0,T(2,u8(2))),T(2,serial),sa,NAME,seq(T(0x17,enc('200101000000Z')),T(0x17,enc('491231235959Z'))),NAME,spki);
  const sig=new Uint8Array(await crypto.subtle.sign(ALG,kp.privateKey,tbs));
  const cert=seq(tbs,sa,T(3,u8(0),sig));
  try{localStorage.setItem('apkid',JSON.stringify({jwk:await crypto.subtle.exportKey('jwk',kp.privateKey),cert:b64(cert),serial:b64(serial)}))}catch(e){}
  return{key:kp.privateKey,cert,serial};
}

/* ---------- Assinatura v1 (JAR) ---------- */
const wrap=l=>{let o='';while(l.length>70){o+=l.slice(0,70)+'\r\n ';l=l.slice(70)}return o+l+'\r\n'};
async function sign(es){
  const id=await getId(),sec=[];
  for(const e of es)sec.push(wrap('Name: '+e.name)+wrap('SHA-256-Digest: '+b64(await sha(e.content)))+'\r\n');
  const mf=enc('Manifest-Version: 1.0\r\nCreated-By: 1.0 (Gerador APK)\r\n\r\n'+sec.join(''));
  let sf='Signature-Version: 1.0\r\nCreated-By: 1.0 (Gerador APK)\r\nSHA-256-Digest-Manifest: '+b64(await sha(mf))+'\r\n\r\n';
  for(let i=0;i<es.length;i++)sf+=wrap('Name: '+es[i].name)+wrap('SHA-256-Digest: '+b64(await sha(enc(sec[i]))))+'\r\n';
  const sfb=enc(sf),sig=new Uint8Array(await crypto.subtle.sign(ALG,id.key,sfb));
  const sa=seq(oid('2.16.840.1.101.3.4.2.1'),NUL);
  const si=seq(T(2,u8(1)),seq(NAME,T(2,id.serial)),sa,seq(oid('1.2.840.113549.1.1.1'),NUL),T(4,sig));
  const sd=seq(T(2,u8(1)),T(0x31,sa),seq(oid('1.2.840.113549.1.7.1')),ctx(0,id.cert),T(0x31,si));
  const rsa=seq(oid('1.2.840.113549.1.7.2'),ctx(0,sd));
  return[['META-INF/MANIFEST.MF',mf],['META-INF/CERT.SF',sfb],['META-INF/CERT.RSA',rsa]].map(([name,c])=>({name,method:0,crc:crc32(c),us:c.length,raw:c,content:c}));
}

/* ---------- Principal ---------- */
$('go').onclick=async()=>{
  try{
    $('log').textContent='';$('dl').hidden=true;
    const sf=$('shell').files[0],uf=$('src').files[0];
    if(!sf||!uf)throw Error('Escolha a casca (.apk) e o seu HTML/ZIP.');
    if(!window.crypto||!crypto.subtle)throw Error('Este navegador bloqueou a criptografia para arquivos locais. Tente abrir o gerador pelo Chrome ou Firefox.');
    log('Lendo a casca...');
    let shell=await readZip(await sf.arrayBuffer());
    if(!shell.some(e=>e.name==='AndroidManifest.xml'))throw Error('Esse arquivo não parece ser um APK.');
    shell=shell.filter(e=>!e.name.endsWith('/')&&!e.name.startsWith('META-INF/')&&!e.name.startsWith('assets/www/'));
    for(const e of shell)e.content=await data(e);

    log('Lendo seu site...');
    let site=[];
    if(/\.zip$/i.test(uf.name)){
      site=(await readZip(await uf.arrayBuffer())).filter(e=>!e.name.endsWith('/')&&!e.name.startsWith('__MACOSX/'));
      if(site.length&&site.every(e=>e.name.includes('/'))&&new Set(site.map(e=>e.name.split('/')[0])).size===1){
        const pre=site[0].name.split('/')[0]+'/';site.forEach(e=>e.name=e.name.slice(pre.length));
      }
      for(const e of site)e.content=await data(e);
    }else{
      const c=new Uint8Array(await uf.arrayBuffer());
      site=[{name:'index.html',method:0,crc:crc32(c),us:c.length,raw:c,content:c}];
    }
    if(!site.some(e=>e.name==='index.html')){
      const h=site.filter(e=>/^[^/]+\.html?$/i.test(e.name));
      if(h.length===1)h[0].name='index.html';else throw Error('Não achei o index.html na raiz do seu ZIP.');
    }
    site.forEach(e=>e.name='assets/www/'+e.name);

    log('Assinando...');
    const all=[...shell,...site],sigs=await sign(all);
    const blob=writeZip([...sigs,...all]);
    const a=$('dl');a.href=URL.createObjectURL(blob);
    a.download=(uf.name.replace(/\.\w+$/,'')||'app')+'.apk';a.hidden=false;
    log('Pronto! Toque em "Baixar APK" ('+(blob.size/1024|0)+' KB).');
  }catch(err){log('Erro: '+err.message)}
};
</script>
</body>
</html>
